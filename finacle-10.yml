---
- name: Finacle 10 Service Management
  hosts: all
  gather_facts: false
  vars:
    # Service Catalog Dictionary
    finacle_catalog:
      finlistval:
        user: finapp
        path: /finbe/GMDEV/APP/Finacle/FC/app/services/finlistval/bin
        start_cmd: ./start-finlistvalGMDEV
        stop_cmd: ./stop-finlistvalGMDEV
        pid_file: LimoIsUp_finlistval_GMDEV_GREENFINCORSVR.pid
      coresession:
        user: finapp
        path: /finbe/GMDEV/APP/Finacle/FC/app/services/coresession/bin
        start_cmd: ./start-coresessionGMDEV
        stop_cmd: ./stop-coresessionGMDEV
        pid_file: LimoIsUp_coresession_GMDEV_GREENFINCORSVR.pid
      cfg:
        user: finapp
        path: /finbe/GMDEV/APP/ConfigService/bin
        start_cmd: ./start
        stop_cmd: ./stop
        pid_file: LimoIsUp_1df0059909c35c86f48d03d791ac11dd.pid
      FINRPT:
        user: finapp
        path: /finbe/GMDEV/APP/finlstclnt/FINRPT/services/finrptsrvr/bin
        start_cmd: ./start-finrptsrvrGMDEV
        stop_cmd: ./stop-finrptsrvrGMDEV
        pid_file: LimoIsUp_finrptsrvrGMDEV_GREENFINCORSVR.pid
      swift:
        user: finapp
        path: /finbe/GMDEV/APP/Finacle/FC/app/services/trswift_GM/bin
        start_cmd: ./start-trswiftGMDEV
        stop_cmd: ./stop-trswiftGMDEV
        pid_file: LimoIsUp_trswift_GMDEV_GM_GREENFINCORSVR.pid
      was:
        user: wasadm
        path: /finfe/GMDEV/PROFILE/GMDEVPROFILE/bin
        start_cmd: ./startServer.sh GMDEVServer
        stop_cmd: ./stopServer.sh GMDEVServer
        pid_file: LimoIsUp_1df0059909c35c86f48d03d791ac11dd.pid
        clean_temp: true
        temp_dir: /finfe/GMDEV/PROFILE/GMDEVPROFILE/wstemp

  tasks:
    - name: Build target list of services to process
      ansible.builtin.set_fact:
        active_services: "{{ finacle_catalog.keys() | list if target_service == 'all' else [target_service] }}"

    # -------------------------------------------------------------------
    # ACTION: STOP
    # -------------------------------------------------------------------
    - name: Execute STOP command for active services
      when: target_action in ['stop', 'restart']
      block:
        - name: Run service stop script
          ansible.builtin.shell: "{{ finacle_catalog[item].stop_cmd }}"
          args:
            chdir: "{{ finacle_catalog[item].path }}"
          become: true
          become_user: "{{ finacle_catalog[item].user }}"
          become_flags: '-i'
          loop: "{{ active_services }}"
          failed_when: false

        - name: Clean WAS temp files (WAS service specific)
          ansible.builtin.file:
            path: "{{ finacle_catalog[item].temp_dir }}"
            state: absent
          become: true
          become_user: "{{ finacle_catalog[item].user }}"
          when: 
            - finacle_catalog[item].clean_temp is defined
            - finacle_catalog[item].clean_temp | bool
          loop: "{{ active_services }}"
          failed_when: false

    # -------------------------------------------------------------------
    # ACTION: START
    # -------------------------------------------------------------------
    - name: Execute START command for active services
      when: target_action in ['start', 'restart']
      block:
        - name: Pause before restart (if applicable)
          ansible.builtin.pause:
            seconds: 5
          when: target_action == 'restart'

        - name: Run service start script
          ansible.builtin.shell: "{{ finacle_catalog[item].start_cmd }}"
          args:
            chdir: "{{ finacle_catalog[item].path }}"
          become: true
          become_user: "{{ finacle_catalog[item].user }}"
          become_flags: '-i'
          loop: "{{ active_services }}"
          failed_when: false

        - name: Allow services 5 seconds to spawn and write PID files
          ansible.builtin.pause:
            seconds: 5

    # -------------------------------------------------------------------
    # FINAL POST-ACTION STATUS VERIFICATION DASHBOARD
    # -------------------------------------------------------------------
    - name: Inspect process and PID status post-execution
      ansible.builtin.shell: |
        PID_FILE="{{ finacle_catalog[item].path }}/{{ finacle_catalog[item].pid_file }}"
        if [ -f "$PID_FILE" ]; then
          PID=$(cat "$PID_FILE" 2>/dev/null | tr -d '\r\n')
          if [ -n "$PID" ] && ps -p "$PID" > /dev/null 2>&1; then
            echo "RUNNING|PID: $PID"
          else
            echo "STALE_PID|PID file exists (PID: $PID), but process is dead in OS"
          fi
        else
          echo "STOPPED|No PID file present, service is stopped"
        fi
      loop: "{{ active_services }}"
      register: status_raw
      changed_when: false
      failed_when: false

    - name: Display Final Finacle Service Status Dashboard
      ansible.builtin.debug:
        msg: |
          ======================================================================
          FINACLE 10 SERVICE DASHBOARD [ACTION: {{ target_action | upper }}]
          ======================================================================
          {% for res in status_raw.results %}
          Service   : {{ res.item }}
          Owner     : {{ finacle_catalog[res.item].user }}
          Status    : {{ res.stdout.split('|')[0] }}
          Details   : {{ res.stdout.split('|')[1] }}
          Path      : {{ finacle_catalog[res.item].path }}
          ----------------------------------------------------------------------
          {% endfor %}
