---
# AWX Job Template: "FinEdge - Health Check"        (SINGLE FILE: copy just this one file into the AWX project)
# READ-ONLY. Changes nothing on the servers.
#
# It NEVER fails the job by default (ignore_errors / ignore_unreachable on every play). The result is the REPORT:
#   * the job output ([ UP ] / [WAIT] / [DOWN] lines) and the FINAL RESULT block on the last lines
#   * an Excel file you can download (see "Excel report")
# To make the job turn RED when something critical is down (scheduled runs + notifications):
#   extra var   fail_on_problems: true
#
# What it reports
#   Backend services  : Supervisor state (RUNNING/FATAL/BACKOFF/STOPPED), pid, uptime, port listening, AND whether the
#                       service is registered UP in Eureka. Also shows services Eureka knows about that run on OTHER servers.
#   Messaging / cache : Redis, Schema Registry, Debezium Connect (kafka-connect) via systemctl; Kafka (container kafka-kraft,
#                       KRaft mode, no ZooKeeper), Kafka UI and RedisInsight via docker; Docker engine enabled at boot.
#   Database          : PostgreSQL via systemctl, pg_isready, databases exist, connections vs limit, Debezium replication slot lag.
#   Frontend          : nginx via systemctl, site answers, live release.
#   Tools server      : Jenkins, Kibana, Grafana, Elasticsearch (informational, never critical).
#   Every host        : uptime, memory, pending reboot, disks >= 85% full.
#
# Hosts (inventory host or group names; override with extra vars):
#   frontend_hosts (cwgfinEFEND)  db_hosts (finedge_db)  cicd_hosts (finedge_cicd)  target_hosts (cwgfinEBEND = backend)
#   Only these hosts are touched and reported. The rest of a dynamic (Nutanix) inventory is ignored.
#
# Excel report
#   Built on the "report host" (default: the cicd_hosts host = Jenkins server) and saved in
#     report_dir       /var/lib/jenkins/userContent/health-reports/
#   Jenkins serves that folder, so download it in a browser (log in to Jenkins first):
#     latest file      http://172.20.250.6:8080/userContent/health-reports/finedge-health-latest.xlsx
#     all files        http://172.20.250.6:8080/userContent/health-reports/
#   The URL is printed in the FINAL RESULT block and attached to the AWX job (Details tab > Artifacts: health_report_url).
#   Times inside the workbook are Lagos time (WAT). The servers' own clocks are on New York time (EDT).
#   Overrides: report_host, report_dir, report_url_base, report_owner (jenkins), report_keep_days (14).
#   If there is no report host, the whole table is printed in the job output instead.
#
# Tunables (extra vars): disk_warn_pct (85), conn_warn_pct (80), wal_warn_mb (5120)

# ======================= Play 1: frontends =======================
- name: FinEdge | Health - frontends
  hosts: "{{ frontend_hosts | default('cwgfinEFEND') }}"
  become: true
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  vars:
    frontend_releases_root: /var/www/finedgeV2/releases
    infra_components:
      - { tier: Frontend, name: Nginx, units: [nginx], port: 80, critical: true }
    hot: |-
      {% set ns = namespace(h=[]) -%}
      {% for l in df.stdout_lines[1:] -%}
      {% set p = l.split() -%}
      {% if p | length >= 6 and (p[4] | replace('%', '') | int) >= (disk_warn_pct | default(85) | int) -%}
      {% set ns.h = ns.h + [p[5] ~ ' ' ~ p[4]] -%}
      {% endif -%}
      {% endfor -%}
      {{ ns.h | join(', ') }}
    reboot_txt: "{{ 'REBOOT REQUIRED (pending updates). After a reboot ALL services cold-start at once: see runbook section D.' if (reboot_req.stat.exists | default(false)) else 'no reboot pending' }}"
    disk_txt: "{{ ('Filesystems at or above ' ~ (disk_warn_pct | default(85)) ~ '%: ' ~ hot) if hot | length > 0 else ('all filesystems below ' ~ (disk_warn_pct | default(85)) ~ '%') }}"
  tasks:
    - name: Mark this host as checked (the report covers ONLY these hosts, never the whole dynamic inventory)
      ansible.builtin.group_by:
        key: finedge_health_checked
      changed_when: false

    - name: Listening TCP ports
      ansible.builtin.command: ss -ltn
      register: ss
      changed_when: false
      failed_when: false

    - name: Probe systemd units
      ansible.builtin.shell: |
        for u in {{ item.units | join(' ') }}; do
          if [ "$(systemctl show "$u" -p LoadState --value 2>/dev/null)" = "loaded" ]; then
            echo "UNIT=$u"
            echo "ACTIVE=$(systemctl is-active "$u" 2>/dev/null)"
            echo "SUB=$(systemctl show "$u" -p SubState --value 2>/dev/null)"
            echo "ENABLED=$(systemctl is-enabled "$u" 2>/dev/null)"
            echo "SINCE=$(systemctl show "$u" -p ActiveEnterTimestamp --value 2>/dev/null)"
            exit 0
          fi
        done
        echo "UNIT=none"
      args:
        executable: /bin/bash
      register: probes
      changed_when: false
      failed_when: false
      loop: "{{ infra_components }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Record systemd results
      ansible.builtin.set_fact:
        probe_lines: "{{ probe_lines | default([]) + [line] }}"
        probe_bad: "{{ probe_bad | default([]) + ([comp.name] if (verdict == 'DOWN' and (comp.critical | default(true))) else []) }}"
        boot_warn: "{{ boot_warn | default([]) + ([comp.name ~ ' (' ~ unit ~ ') is ' ~ enabled ~ ', so it will NOT start by itself after a reboot'] if (unit != 'none' and enabled != 'enabled') else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, comp.tier | default('Service'), comp.name, verdict, detail ~ note]] }}"
      vars:
        comp: "{{ infra_components[idx] }}"
        out: "{{ probes.results[idx].stdout | default('UNIT=none') }}"
        unit: "{{ out | regex_findall('UNIT=([A-Za-z0-9@._:-]+)') | first | default('none') }}"
        active: "{{ out | regex_findall('ACTIVE=([a-z-]+)') | first | default('unknown') }}"
        sub: "{{ out | regex_findall('SUB=([a-z-]+)') | first | default('?') }}"
        enabled: "{{ out | regex_findall('ENABLED=([a-z-]+)') | first | default('unknown') }}"
        since: "{{ out | regex_findall('SINCE=(.*)') | first | default('') }}"
        has_port: "{{ comp.port is defined }}"
        port_up: "{{ (ss.stdout is search(':' ~ comp.port ~ ' ')) if has_port else true }}"
        verdict: "{{ 'UP' if ((unit != 'none' and active == 'active' and port_up) or (unit == 'none' and has_port and port_up)) else ('ABSENT' if (unit == 'none' and (comp.optional | default(false))) else 'DOWN') }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else ('[ -- ]' if verdict == 'ABSENT' else '[DOWN]') }}"
        port_txt: "{{ ('port ' ~ comp.port ~ (' listening' if port_up else ' NOT listening')) if has_port else 'no port to check' }}"
        detail: "{{ ('systemd ' ~ unit ~ ' is ' ~ active ~ ' (' ~ sub ~ '), enabled=' ~ enabled ~ (', since ' ~ since if since else '') ~ '; ' ~ port_txt) if unit != 'none' else ('no systemd unit found (tried ' ~ (comp.units | join(', ')) ~ '); ' ~ port_txt ~ (' - running outside systemd (Docker or manual?)' if (has_port and port_up) else '')) }}"
        note: "{{ '  (non-critical)' if (verdict == 'DOWN' and not (comp.critical | default(true))) else ('  (not present, fine if unused)' if verdict == 'ABSENT' else '') }}"
        line: "{{ tag }} {{ comp.name }}: {{ detail }}{{ note }}"
      loop: "{{ range(infra_components | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ infra_components[idx].name }}"

    - name: Site answers
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: [200, 301, 302]
        follow_redirects: none
        timeout: 5
      register: site
      ignore_errors: true

    - name: Which release is live
      ansible.builtin.stat:
        path: "{{ frontend_releases_root }}/current"
      register: cur

    - name: Frontend report
      ansible.builtin.debug:
        msg: "{{ probe_lines | default([]) + [site_line, release_line] }}"
      vars:
        site_line: "{{ '[ UP ] site answers on http://127.0.0.1/' if not (site.failed | default(false)) else '[DOWN] site does NOT answer on http://127.0.0.1/' }}"
        release_line: "{{ ('[ OK ] live release = ' ~ (cur.stat.lnk_source | basename)) if (cur.stat.islnk | default(false)) else '[DOWN] no release symlink at ' ~ frontend_releases_root ~ '/current' }}"

    - name: Record frontend results
      ansible.builtin.set_fact:
        host_problems: "{{ (probe_bad | default([])) + (['site does not answer'] if site_bad else []) + (['no release symlink'] if not has_link else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Frontend', 'Site answers', ('DOWN' if site_bad else 'UP'), 'http://127.0.0.1/'], [inventory_hostname, 'Frontend', 'Live release', ('OK' if has_link else 'DOWN'), (cur.stat.lnk_source | basename) if has_link else 'no release symlink']] }}"
      vars:
        site_bad: "{{ site.failed | default(false) }}"
        has_link: "{{ cur.stat.islnk | default(false) }}"

    - name: Uptime
      ansible.builtin.command: uptime -p
      register: up_p
      changed_when: false
      failed_when: false

    - name: Pending reboot flag (the "System restart required" banner)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_req

    - name: Memory
      ansible.builtin.shell: free -m | awk 'NR==2{print $3"/"$2" MB used"}'
      register: mem
      changed_when: false
      failed_when: false

    - name: Filesystems
      ansible.builtin.command: df -P -x tmpfs -x devtmpfs -x squashfs -x overlay
      register: df
      changed_when: false
      failed_when: false

    - name: Host basics
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ up_p.stdout | default('uptime n/a') }} | memory {{ mem.stdout | default('n/a') }}"
          - "{{ reboot_txt }}"
          - "{{ disk_txt }}"

    - name: Record host basics
      ansible.builtin.set_fact:
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Host', 'Uptime / memory', 'INFO', (up_p.stdout | default('n/a')) ~ ' | memory ' ~ (mem.stdout | default('n/a'))], [inventory_hostname, 'Host', 'Reboot pending', ('WARN' if (reboot_req.stat.exists | default(false)) else 'OK'), reboot_txt], [inventory_hostname, 'Host', 'Disk usage', ('WARN' if hot | length > 0 else 'OK'), disk_txt]] }}"

# ======================= Play 2: database server =======================
- name: FinEdge | Health - database server
  hosts: "{{ db_hosts | default('finedge_db') }}"
  become: true
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  vars:
    conn_warn_pct: 80          # warn when connections in use reach this % of max_connections
    wal_warn_mb: 5120          # warn when a replication slot holds back this much WAL
    infra_components:
      # On Ubuntu 'postgresql' is a wrapper unit that shows "active (exited)": the port and pg_isready below are the real proof.
      - { tier: Database, name: PostgreSQL, units: [postgresql], port: 5432, critical: true }
    expected_dbs: [finedge, finedge_subscription]
    hot: |-
      {% set ns = namespace(h=[]) -%}
      {% for l in df.stdout_lines[1:] -%}
      {% set p = l.split() -%}
      {% if p | length >= 6 and (p[4] | replace('%', '') | int) >= (disk_warn_pct | default(85) | int) -%}
      {% set ns.h = ns.h + [p[5] ~ ' ' ~ p[4]] -%}
      {% endif -%}
      {% endfor -%}
      {{ ns.h | join(', ') }}
    reboot_txt: "{{ 'REBOOT REQUIRED (pending updates). After a reboot ALL services cold-start at once: see runbook section D.' if (reboot_req.stat.exists | default(false)) else 'no reboot pending' }}"
    disk_txt: "{{ ('Filesystems at or above ' ~ (disk_warn_pct | default(85)) ~ '%: ' ~ hot) if hot | length > 0 else ('all filesystems below ' ~ (disk_warn_pct | default(85)) ~ '%') }}"
  tasks:
    - name: Mark this host as checked (the report covers ONLY these hosts, never the whole dynamic inventory)
      ansible.builtin.group_by:
        key: finedge_health_checked
      changed_when: false

    - name: Listening TCP ports
      ansible.builtin.command: ss -ltn
      register: ss
      changed_when: false
      failed_when: false

    - name: Probe systemd units
      ansible.builtin.shell: |
        for u in {{ item.units | join(' ') }}; do
          if [ "$(systemctl show "$u" -p LoadState --value 2>/dev/null)" = "loaded" ]; then
            echo "UNIT=$u"
            echo "ACTIVE=$(systemctl is-active "$u" 2>/dev/null)"
            echo "SUB=$(systemctl show "$u" -p SubState --value 2>/dev/null)"
            echo "ENABLED=$(systemctl is-enabled "$u" 2>/dev/null)"
            echo "SINCE=$(systemctl show "$u" -p ActiveEnterTimestamp --value 2>/dev/null)"
            exit 0
          fi
        done
        echo "UNIT=none"
      args:
        executable: /bin/bash
      register: probes
      changed_when: false
      failed_when: false
      loop: "{{ infra_components }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Record systemd results
      ansible.builtin.set_fact:
        probe_lines: "{{ probe_lines | default([]) + [line] }}"
        probe_bad: "{{ probe_bad | default([]) + ([comp.name] if (verdict == 'DOWN' and (comp.critical | default(true))) else []) }}"
        boot_warn: "{{ boot_warn | default([]) + ([comp.name ~ ' (' ~ unit ~ ') is ' ~ enabled ~ ', so it will NOT start by itself after a reboot'] if (unit != 'none' and enabled != 'enabled') else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, comp.tier | default('Service'), comp.name, verdict, detail ~ note]] }}"
      vars:
        comp: "{{ infra_components[idx] }}"
        out: "{{ probes.results[idx].stdout | default('UNIT=none') }}"
        unit: "{{ out | regex_findall('UNIT=([A-Za-z0-9@._:-]+)') | first | default('none') }}"
        active: "{{ out | regex_findall('ACTIVE=([a-z-]+)') | first | default('unknown') }}"
        sub: "{{ out | regex_findall('SUB=([a-z-]+)') | first | default('?') }}"
        enabled: "{{ out | regex_findall('ENABLED=([a-z-]+)') | first | default('unknown') }}"
        since: "{{ out | regex_findall('SINCE=(.*)') | first | default('') }}"
        has_port: "{{ comp.port is defined }}"
        port_up: "{{ (ss.stdout is search(':' ~ comp.port ~ ' ')) if has_port else true }}"
        verdict: "{{ 'UP' if ((unit != 'none' and active == 'active' and port_up) or (unit == 'none' and has_port and port_up)) else ('ABSENT' if (unit == 'none' and (comp.optional | default(false))) else 'DOWN') }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else ('[ -- ]' if verdict == 'ABSENT' else '[DOWN]') }}"
        port_txt: "{{ ('port ' ~ comp.port ~ (' listening' if port_up else ' NOT listening')) if has_port else 'no port to check' }}"
        detail: "{{ ('systemd ' ~ unit ~ ' is ' ~ active ~ ' (' ~ sub ~ '), enabled=' ~ enabled ~ (', since ' ~ since if since else '') ~ '; ' ~ port_txt) if unit != 'none' else ('no systemd unit found (tried ' ~ (comp.units | join(', ')) ~ '); ' ~ port_txt ~ (' - running outside systemd (Docker or manual?)' if (has_port and port_up) else '')) }}"
        note: "{{ '  (non-critical)' if (verdict == 'DOWN' and not (comp.critical | default(true))) else ('  (not present, fine if unused)' if verdict == 'ABSENT' else '') }}"
        line: "{{ tag }} {{ comp.name }}: {{ detail }}{{ note }}"
      loop: "{{ range(infra_components | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ infra_components[idx].name }}"

    - name: pg_isready
      ansible.builtin.shell: |
        if command -v pg_isready >/dev/null 2>&1; then
          pg_isready -h 127.0.0.1 -p 5432
        else
          echo "pg_isready not installed (port check above still applies)"
        fi
      register: pg_ready
      changed_when: false
      failed_when: false

    - name: Databases that exist
      ansible.builtin.shell: |
        sudo -u postgres psql -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY 1" 2>&1
      register: pg_dbs
      changed_when: false
      failed_when: false

    - name: Connection usage (used|max)
      ansible.builtin.shell: |
        sudo -u postgres psql -Atc "SELECT count(*) || '|' || current_setting('max_connections') FROM pg_stat_activity" 2>&1
      register: pg_conn
      changed_when: false
      failed_when: false

    - name: Replication slots (name|active|MB of WAL held back)
      ansible.builtin.shell: |
        sudo -u postgres psql -Atc "SELECT slot_name || '|' || active || '|' || coalesce(round(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) / 1024 / 1024)::bigint::text, '-') FROM pg_replication_slots" 2>&1
      register: pg_slots
      changed_when: false
      failed_when: false

    - name: Record replication slots
      ansible.builtin.set_fact:
        slot_msgs: "{{ slot_msgs | default([]) + [msg] }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Database', 'Replication slot ' ~ sname, ('WARN' if (not active or wal_big) else 'OK'), msg]] }}"
      vars:
        parts: "{{ item.split('|') }}"
        sname: "{{ parts[0] }}"
        active: "{{ (parts[1] | default('')) in ['true', 't'] }}"
        mb: "{{ parts[2] | default('-') }}"
        wal_big: "{{ mb != '-' and (mb | int) >= (wal_warn_mb | int) }}"
        msg: "slot {{ sname }}: active={{ 'yes' if active else 'NO' }}, WAL held back {{ (mb ~ ' MB') if mb != '-' else 'n/a' }}{{ ' (>= ' ~ wal_warn_mb ~ ' MB: the consumer is not advancing the slot; for Debezium see heartbeat.interval.ms and heartbeat.action.query)' if wal_big else '' }}{{ ' - INACTIVE slot: Postgres keeps WAL forever and can fill the disk' if not active else '' }}"
      loop: "{{ pg_slots.stdout_lines if pg_slots.rc == 0 else [] }}"

    - name: Database report
      ansible.builtin.debug:
        msg: "{{ probe_lines | default([]) + extra }}"
      vars:
        missing: "{{ expected_dbs | difference(pg_dbs.stdout_lines) if pg_dbs.rc == 0 else [] }}"
        conn_used: "{{ pg_conn.stdout | regex_findall('^([0-9]+)[|]', multiline=True) | first | default(0) | int }}"
        conn_max: "{{ pg_conn.stdout | regex_findall('[|]([0-9]+)$', multiline=True) | first | default(0) | int }}"
        extra:
          - "pg_isready: {{ pg_ready.stdout | trim }}"
          - "databases: {{ pg_dbs.stdout_lines | join(', ') if pg_dbs.rc == 0 else 'could not list (' ~ (pg_dbs.stdout | trim) ~ ')' }}{{ '  MISSING: ' ~ (missing | join(', ')) if missing | length > 0 else '' }}"
          - "connections: {{ (conn_used ~ ' of ' ~ conn_max ~ ' in use (' ~ ((conn_used * 100 // conn_max) if conn_max > 0 else 0) ~ '%)') if conn_max > 0 else ('could not read: ' ~ (pg_conn.stdout | trim)) }}"
          - "replication slots: {{ slot_msgs | default(['none found']) }}"

    - name: Record database results
      ansible.builtin.set_fact:
        host_problems: "{{ (probe_bad | default([])) + (['missing database: ' ~ (missing | join(', '))] if missing | length > 0 else []) + (['pg_isready got no response'] if isready == 'DOWN' else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Database', 'pg_isready', isready, pg_ready.stdout | trim], [inventory_hostname, 'Database', 'Databases exist', ('MISSING' if missing | length > 0 else ('OK' if pg_dbs.rc == 0 else 'INFO')), (pg_dbs.stdout_lines | join(', ')) ~ (('  MISSING: ' ~ (missing | join(', '))) if missing | length > 0 else '')], [inventory_hostname, 'Database', 'Connections', conn_status, conn_txt]] }}"
      vars:
        missing: "{{ expected_dbs | difference(pg_dbs.stdout_lines) if pg_dbs.rc == 0 else [] }}"
        isready: "{{ 'UP' if (pg_ready.stdout is search('accepting connections')) else ('INFO' if (pg_ready.stdout is search('not installed')) else 'DOWN') }}"
        conn_used: "{{ pg_conn.stdout | regex_findall('^([0-9]+)[|]', multiline=True) | first | default(0) | int }}"
        conn_max: "{{ pg_conn.stdout | regex_findall('[|]([0-9]+)$', multiline=True) | first | default(0) | int }}"
        conn_pct: "{{ (conn_used * 100 // conn_max) if conn_max > 0 else 0 }}"
        conn_status: "{{ 'INFO' if conn_max == 0 else ('WARN' if (conn_pct | int) >= (conn_warn_pct | int) else 'OK') }}"
        conn_txt: "{{ (conn_used ~ ' of ' ~ conn_max ~ ' connections in use (' ~ conn_pct ~ '%)') if conn_max > 0 else ('could not read: ' ~ (pg_conn.stdout | trim)) }}"

    - name: Uptime
      ansible.builtin.command: uptime -p
      register: up_p
      changed_when: false
      failed_when: false

    - name: Pending reboot flag (the "System restart required" banner)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_req

    - name: Memory
      ansible.builtin.shell: free -m | awk 'NR==2{print $3"/"$2" MB used"}'
      register: mem
      changed_when: false
      failed_when: false

    - name: Filesystems
      ansible.builtin.command: df -P -x tmpfs -x devtmpfs -x squashfs -x overlay
      register: df
      changed_when: false
      failed_when: false

    - name: Host basics
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ up_p.stdout | default('uptime n/a') }} | memory {{ mem.stdout | default('n/a') }}"
          - "{{ reboot_txt }}"
          - "{{ disk_txt }}"

    - name: Record host basics
      ansible.builtin.set_fact:
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Host', 'Uptime / memory', 'INFO', (up_p.stdout | default('n/a')) ~ ' | memory ' ~ (mem.stdout | default('n/a'))], [inventory_hostname, 'Host', 'Reboot pending', ('WARN' if (reboot_req.stat.exists | default(false)) else 'OK'), reboot_txt], [inventory_hostname, 'Host', 'Disk usage', ('WARN' if hot | length > 0 else 'OK'), disk_txt]] }}"

# ======================= Play 3: CI/CD and monitoring server =======================
- name: FinEdge | Health - Jenkins, Kibana, Grafana (informational)
  hosts: "{{ cicd_hosts | default('finedge_cicd') }}"
  become: true
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  vars:
    infra_components:
      - { tier: Tools, name: Jenkins,       units: [jenkins],        port: 8080, critical: false }
      - { tier: Tools, name: Kibana,        units: [kibana],         port: 5602, critical: false }
      - { tier: Tools, name: Grafana,       units: [grafana-server], port: 3000, critical: false }
      - { tier: Tools, name: Elasticsearch, units: [elasticsearch],  port: 9200, critical: false }
    hot: |-
      {% set ns = namespace(h=[]) -%}
      {% for l in df.stdout_lines[1:] -%}
      {% set p = l.split() -%}
      {% if p | length >= 6 and (p[4] | replace('%', '') | int) >= (disk_warn_pct | default(85) | int) -%}
      {% set ns.h = ns.h + [p[5] ~ ' ' ~ p[4]] -%}
      {% endif -%}
      {% endfor -%}
      {{ ns.h | join(', ') }}
    reboot_txt: "{{ 'REBOOT REQUIRED (pending updates). After a reboot ALL services cold-start at once: see runbook section D.' if (reboot_req.stat.exists | default(false)) else 'no reboot pending' }}"
    disk_txt: "{{ ('Filesystems at or above ' ~ (disk_warn_pct | default(85)) ~ '%: ' ~ hot) if hot | length > 0 else ('all filesystems below ' ~ (disk_warn_pct | default(85)) ~ '%') }}"
  tasks:
    - name: Mark this host as checked (the report covers ONLY these hosts, never the whole dynamic inventory)
      ansible.builtin.group_by:
        key: finedge_health_checked
      changed_when: false

    - name: Listening TCP ports
      ansible.builtin.command: ss -ltn
      register: ss
      changed_when: false
      failed_when: false

    - name: Probe systemd units
      ansible.builtin.shell: |
        for u in {{ item.units | join(' ') }}; do
          if [ "$(systemctl show "$u" -p LoadState --value 2>/dev/null)" = "loaded" ]; then
            echo "UNIT=$u"
            echo "ACTIVE=$(systemctl is-active "$u" 2>/dev/null)"
            echo "SUB=$(systemctl show "$u" -p SubState --value 2>/dev/null)"
            echo "ENABLED=$(systemctl is-enabled "$u" 2>/dev/null)"
            echo "SINCE=$(systemctl show "$u" -p ActiveEnterTimestamp --value 2>/dev/null)"
            exit 0
          fi
        done
        echo "UNIT=none"
      args:
        executable: /bin/bash
      register: probes
      changed_when: false
      failed_when: false
      loop: "{{ infra_components }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Record systemd results
      ansible.builtin.set_fact:
        probe_lines: "{{ probe_lines | default([]) + [line] }}"
        probe_bad: "{{ probe_bad | default([]) + ([comp.name] if (verdict == 'DOWN' and (comp.critical | default(true))) else []) }}"
        boot_warn: "{{ boot_warn | default([]) + ([comp.name ~ ' (' ~ unit ~ ') is ' ~ enabled ~ ', so it will NOT start by itself after a reboot'] if (unit != 'none' and enabled != 'enabled') else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, comp.tier | default('Service'), comp.name, verdict, detail ~ note]] }}"
      vars:
        comp: "{{ infra_components[idx] }}"
        out: "{{ probes.results[idx].stdout | default('UNIT=none') }}"
        unit: "{{ out | regex_findall('UNIT=([A-Za-z0-9@._:-]+)') | first | default('none') }}"
        active: "{{ out | regex_findall('ACTIVE=([a-z-]+)') | first | default('unknown') }}"
        sub: "{{ out | regex_findall('SUB=([a-z-]+)') | first | default('?') }}"
        enabled: "{{ out | regex_findall('ENABLED=([a-z-]+)') | first | default('unknown') }}"
        since: "{{ out | regex_findall('SINCE=(.*)') | first | default('') }}"
        has_port: "{{ comp.port is defined }}"
        port_up: "{{ (ss.stdout is search(':' ~ comp.port ~ ' ')) if has_port else true }}"
        verdict: "{{ 'UP' if ((unit != 'none' and active == 'active' and port_up) or (unit == 'none' and has_port and port_up)) else ('ABSENT' if (unit == 'none' and (comp.optional | default(false))) else 'DOWN') }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else ('[ -- ]' if verdict == 'ABSENT' else '[DOWN]') }}"
        port_txt: "{{ ('port ' ~ comp.port ~ (' listening' if port_up else ' NOT listening')) if has_port else 'no port to check' }}"
        detail: "{{ ('systemd ' ~ unit ~ ' is ' ~ active ~ ' (' ~ sub ~ '), enabled=' ~ enabled ~ (', since ' ~ since if since else '') ~ '; ' ~ port_txt) if unit != 'none' else ('no systemd unit found (tried ' ~ (comp.units | join(', ')) ~ '); ' ~ port_txt ~ (' - running outside systemd (Docker or manual?)' if (has_port and port_up) else '')) }}"
        note: "{{ '  (non-critical)' if (verdict == 'DOWN' and not (comp.critical | default(true))) else ('  (not present, fine if unused)' if verdict == 'ABSENT' else '') }}"
        line: "{{ tag }} {{ comp.name }}: {{ detail }}{{ note }}"
      loop: "{{ range(infra_components | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ infra_components[idx].name }}"

    - name: Tools report
      ansible.builtin.debug:
        msg: "{{ probe_lines | default([]) }}"

    - name: Uptime
      ansible.builtin.command: uptime -p
      register: up_p
      changed_when: false
      failed_when: false

    - name: Pending reboot flag (the "System restart required" banner)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_req

    - name: Memory
      ansible.builtin.shell: free -m | awk 'NR==2{print $3"/"$2" MB used"}'
      register: mem
      changed_when: false
      failed_when: false

    - name: Filesystems
      ansible.builtin.command: df -P -x tmpfs -x devtmpfs -x squashfs -x overlay
      register: df
      changed_when: false
      failed_when: false

    - name: Host basics
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ up_p.stdout | default('uptime n/a') }} | memory {{ mem.stdout | default('n/a') }}"
          - "{{ reboot_txt }}"
          - "{{ disk_txt }}"

    - name: Record host basics
      ansible.builtin.set_fact:
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Host', 'Uptime / memory', 'INFO', (up_p.stdout | default('n/a')) ~ ' | memory ' ~ (mem.stdout | default('n/a'))], [inventory_hostname, 'Host', 'Reboot pending', ('WARN' if (reboot_req.stat.exists | default(false)) else 'OK'), reboot_txt], [inventory_hostname, 'Host', 'Disk usage', ('WARN' if hot | length > 0 else 'OK'), disk_txt]] }}"

# ======================= Play 4: backend server =======================
- name: FinEdge | Health - backend services (Supervisor), messaging and cache
  hosts: "{{ target_hosts | default('cwgfinEBEND') }}"
  become: true
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  vars:
    # Supervisor program names exactly as in /etc/supervisor/conf.d on the server. port = what it listens on.
    # eureka = the name it registers with in Eureka (spring.application.name, upper case; the registry itself does not register).
    # subscription-service is NOT here: it has no conf on this server. It shows up below under "remote services" via Eureka.
    backend_services:
      - { name: service-registry,           port: 8761, eureka: '' }
      - { name: api-gateway,                port: 8765, eureka: API-GATEWAY }
      - { name: admin-service,              port: 8080, eureka: ADMIN-SETUP-SERVICE }
      - { name: banking-operations-service, port: 8081, eureka: BANKING-SERVICE }
      - { name: customer-service,           port: 8082, eureka: CUSTOMER-SERVICE }
      - { name: deposit-service,            port: 8083, eureka: DEPOSIT-SERVICE }
      - { name: sms-email-service,          port: 8084, eureka: SMS-EMAIL-SERVICE }
      - { name: loan-service,               port: 8085, eureka: LOAN-SERVICE }
      - { name: auth-service,               port: 8086, eureka: AUTH-SERVICE }
      - { name: placement-service,          port: 8087, eureka: PLACEMENT-SERVICE }
      - { name: card-service,               port: 8089, eureka: CARD-SERVICE }
      - { name: audit-query-service,        port: 8090, eureka: AUDIT-QUERY-SERVICE }
      - { name: foreign-exchange-service,   port: 8091, eureka: FOREIGN-EXCHANGE }

    # systemd units (names confirmed on the server)
    infra_components:
      - { tier: Messaging / cache, name: Redis,                         units: [redis-server],    port: 6379,  critical: true }
      - { tier: Messaging / cache, name: Schema Registry,               units: [schema-registry], port: 18081, critical: true }
      - { tier: Messaging / cache, name: Debezium Connect (kafka-connect), units: [kafka-connect], port: 18083, critical: true }
      - { tier: Messaging / cache, name: Docker engine,                 units: [docker],                       critical: true }

    # docker containers (Kafka runs here in KRaft mode: there is no kafka systemd unit and no ZooKeeper)
    docker_components:
      - { tier: Messaging / cache, name: Kafka (KRaft),  container: kafka-kraft,  port: 9092, critical: true }
      - { tier: Tools,             name: Kafka UI,       container: kafka-ui,     port: 9090, critical: false }
      - { tier: Tools,             name: RedisInsight,   container: redisinsight, port: 5540, critical: false }

    eu_ok: "{{ eureka.json is defined }}"
    raw_apps: "{{ ((eureka.json | default({})).applications | default({})).application | default([]) }}"
    eu_apps: "{{ [raw_apps] if raw_apps is mapping else raw_apps }}"
    eu_lines: |-
      {% set ns = namespace(l=[]) -%}
      {% for a in eu_apps -%}
      {% set insts = [a.instance] if a.instance is mapping else a.instance -%}
      {% for i in insts -%}
      {% set ns.l = ns.l + [a.name ~ '|' ~ (i.status | default('?')) ~ '|' ~ (i.ipAddr | default('?')) ~ ':' ~ ((i.port | default({}))['$'] | default('?'))] -%}
      {% endfor -%}
      {% endfor -%}
      {{ ns.l }}
    hot: |-
      {% set ns = namespace(h=[]) -%}
      {% for l in df.stdout_lines[1:] -%}
      {% set p = l.split() -%}
      {% if p | length >= 6 and (p[4] | replace('%', '') | int) >= (disk_warn_pct | default(85) | int) -%}
      {% set ns.h = ns.h + [p[5] ~ ' ' ~ p[4]] -%}
      {% endif -%}
      {% endfor -%}
      {{ ns.h | join(', ') }}
    reboot_txt: "{{ 'REBOOT REQUIRED (pending updates). After a reboot ALL services cold-start at once: see runbook section D.' if (reboot_req.stat.exists | default(false)) else 'no reboot pending' }}"
    disk_txt: "{{ ('Filesystems at or above ' ~ (disk_warn_pct | default(85)) ~ '%: ' ~ hot) if hot | length > 0 else ('all filesystems below ' ~ (disk_warn_pct | default(85)) ~ '%') }}"
  tasks:
    - name: Mark this host as checked (the report covers ONLY these hosts, never the whole dynamic inventory)
      ansible.builtin.group_by:
        key: finedge_health_checked
      changed_when: false

    - name: Supervisor status of every program
      ansible.builtin.command: supervisorctl status
      register: sup
      changed_when: false
      failed_when: false

    - name: Listening TCP ports
      ansible.builtin.command: ss -ltn
      register: ss
      changed_when: false
      failed_when: false

    - name: Eureka registrations
      ansible.builtin.uri:
        url: http://127.0.0.1:8761/eureka/apps
        headers:
          Accept: application/json
        timeout: 10
      register: eureka
      ignore_errors: true
      when: ss.stdout is search(':8761 ')

    # ---------- 1. backend services: Supervisor state + port + Eureka ----------
    - name: Service report
      ansible.builtin.set_fact:
        svc_lines: "{{ svc_lines | default([]) + [line] }}"
        svc_up: "{{ svc_up | default([]) + ([svc_item.name] if verdict == 'UP' else []) }}"
        svc_wait: "{{ svc_wait | default([]) + ([svc_item.name] if verdict == 'STARTING' else []) }}"
        svc_bad: "{{ svc_bad | default([]) + ([svc_item.name] if verdict == 'DOWN' else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Backend service', svc_item.name, ('WAIT' if verdict == 'STARTING' else verdict), state ~ (' (' ~ detail ~ ')' if detail else '') ~ ' | port ' ~ svc_item.port ~ (' listening' if port_up else ' NOT listening') ~ ' | eureka ' ~ eu_state ~ (' at ' ~ eu_addr if eu_addr else '')]] }}"
      vars:
        state: "{{ sup.stdout | default('') | regex_findall('^' ~ svc_item.name ~ ' +([A-Z]+)', multiline=True) | first | default('NOT-IN-SUPERVISOR') }}"
        detail: "{{ sup.stdout | default('') | regex_findall('^' ~ svc_item.name ~ ' +[A-Z]+ +(.*)$', multiline=True) | first | default('') }}"
        port_up: "{{ ss.stdout is search(':' ~ svc_item.port ~ ' ') }}"
        grace: "{{ detail is search('uptime 0:0[0-4]:') }}"
        has_eu: "{{ (svc_item.eureka | default('') | length) > 0 and eu_ok }}"
        eu_txt: "{{ (eu_lines | select('match', '^' ~ svc_item.eureka ~ '[|]') | list | first | default('')) if has_eu else '' }}"
        eu_state: "{{ 'n/a' if not has_eu else ('MISSING' if eu_txt == '' else eu_txt.split('|')[1]) }}"
        eu_addr: "{{ eu_txt.split('|')[2] if eu_txt else '' }}"
        eu_bad: "{{ eu_state not in ['UP', 'n/a'] }}"
        healthy: "{{ state == 'RUNNING' and port_up and not eu_bad }}"
        verdict: "{{ 'UP' if healthy else ('STARTING' if (state == 'STARTING' or (state == 'RUNNING' and grace)) else 'DOWN') }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else ('[WAIT]' if verdict == 'STARTING' else '[DOWN]') }}"
        hint: "{{ '  <- RUNNING but not listening: hung, or wrong port in this playbook' if (state == 'RUNNING' and not port_up and verdict == 'DOWN') else ('  <- running and listening, but ' ~ eu_state ~ ' in Eureka: the gateway cannot route to it' if (state == 'RUNNING' and port_up and eu_bad and verdict == 'DOWN') else '') }}"
        line: "{{ tag }} {{ svc_item.name }}: {{ state }}{{ ' (' ~ detail ~ ')' if detail else '' }} | port {{ svc_item.port }} {{ 'listening' if port_up else 'NOT listening' }} | eureka {{ eu_state }}{{ hint }}"
      loop: "{{ backend_services }}"
      loop_control:
        loop_var: svc_item
        label: "{{ svc_item.name }}"

    - name: Backend services
      ansible.builtin.debug:
        msg: "{{ ['SUMMARY: ' ~ (svc_up | default([]) | length) ~ ' of ' ~ (backend_services | length) ~ ' services UP | starting: ' ~ (svc_wait | default([]) | join(', ') or 'none') ~ ' | DOWN: ' ~ (svc_bad | default([]) | join(', ') or 'none')] + (svc_lines | default([])) }}"

    - name: Programs in Supervisor that this playbook does not know about
      ansible.builtin.debug:
        msg: "Unlisted Supervisor programs (add them to backend_services): {{ extra | join(', ') }}"
      vars:
        known: "{{ backend_services | map(attribute='name') | list }}"
        present: "{{ (sup.stdout_lines | default([])) | map('regex_replace', ' .*$', '') | reject('equalto', '') | list }}"
        extra: "{{ present | difference(known) }}"
      when: extra | length > 0

    # ---------- 2. services Eureka knows about that do NOT run on this server ----------
    - name: Remote services seen in Eureka
      ansible.builtin.set_fact:
        remote_lines: "{{ remote_lines | default([]) + [rline] }}"
        remote_bad: "{{ remote_bad | default([]) + ([parts[0]] if parts[1] != 'UP' else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Backend service (remote)', parts[0], ('UP' if parts[1] == 'UP' else 'DOWN'), 'registered in Eureka as ' ~ parts[1] ~ ' at ' ~ parts[2] ~ ' (not a Supervisor program on this server)']] }}"
      vars:
        parts: "{{ eu_line.split('|') }}"
        rline: "{{ '[ UP ]' if parts[1] == 'UP' else '[DOWN]' }} {{ parts[0] }} runs elsewhere: Eureka says {{ parts[1] }} at {{ parts[2] }}"
      loop: "{{ eu_lines | reject('match', '^(' ~ (backend_services | map(attribute='eureka') | reject('equalto', '') | join('|')) ~ ')[|]') | list }}"
      loop_control:
        loop_var: eu_line
        label: "{{ eu_line }}"

    - name: Remote services report
      ansible.builtin.debug:
        msg: "{{ remote_lines }}"
      when: remote_lines | default([]) | length > 0

    - name: Probe systemd units
      ansible.builtin.shell: |
        for u in {{ item.units | join(' ') }}; do
          if [ "$(systemctl show "$u" -p LoadState --value 2>/dev/null)" = "loaded" ]; then
            echo "UNIT=$u"
            echo "ACTIVE=$(systemctl is-active "$u" 2>/dev/null)"
            echo "SUB=$(systemctl show "$u" -p SubState --value 2>/dev/null)"
            echo "ENABLED=$(systemctl is-enabled "$u" 2>/dev/null)"
            echo "SINCE=$(systemctl show "$u" -p ActiveEnterTimestamp --value 2>/dev/null)"
            exit 0
          fi
        done
        echo "UNIT=none"
      args:
        executable: /bin/bash
      register: probes
      changed_when: false
      failed_when: false
      loop: "{{ infra_components }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Record systemd results
      ansible.builtin.set_fact:
        probe_lines: "{{ probe_lines | default([]) + [line] }}"
        probe_bad: "{{ probe_bad | default([]) + ([comp.name] if (verdict == 'DOWN' and (comp.critical | default(true))) else []) }}"
        boot_warn: "{{ boot_warn | default([]) + ([comp.name ~ ' (' ~ unit ~ ') is ' ~ enabled ~ ', so it will NOT start by itself after a reboot'] if (unit != 'none' and enabled != 'enabled') else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, comp.tier | default('Service'), comp.name, verdict, detail ~ note]] }}"
      vars:
        comp: "{{ infra_components[idx] }}"
        out: "{{ probes.results[idx].stdout | default('UNIT=none') }}"
        unit: "{{ out | regex_findall('UNIT=([A-Za-z0-9@._:-]+)') | first | default('none') }}"
        active: "{{ out | regex_findall('ACTIVE=([a-z-]+)') | first | default('unknown') }}"
        sub: "{{ out | regex_findall('SUB=([a-z-]+)') | first | default('?') }}"
        enabled: "{{ out | regex_findall('ENABLED=([a-z-]+)') | first | default('unknown') }}"
        since: "{{ out | regex_findall('SINCE=(.*)') | first | default('') }}"
        has_port: "{{ comp.port is defined }}"
        port_up: "{{ (ss.stdout is search(':' ~ comp.port ~ ' ')) if has_port else true }}"
        verdict: "{{ 'UP' if ((unit != 'none' and active == 'active' and port_up) or (unit == 'none' and has_port and port_up)) else ('ABSENT' if (unit == 'none' and (comp.optional | default(false))) else 'DOWN') }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else ('[ -- ]' if verdict == 'ABSENT' else '[DOWN]') }}"
        port_txt: "{{ ('port ' ~ comp.port ~ (' listening' if port_up else ' NOT listening')) if has_port else 'no port to check' }}"
        detail: "{{ ('systemd ' ~ unit ~ ' is ' ~ active ~ ' (' ~ sub ~ '), enabled=' ~ enabled ~ (', since ' ~ since if since else '') ~ '; ' ~ port_txt) if unit != 'none' else ('no systemd unit found (tried ' ~ (comp.units | join(', ')) ~ '); ' ~ port_txt ~ (' - running outside systemd (Docker or manual?)' if (has_port and port_up) else '')) }}"
        note: "{{ '  (non-critical)' if (verdict == 'DOWN' and not (comp.critical | default(true))) else ('  (not present, fine if unused)' if verdict == 'ABSENT' else '') }}"
        line: "{{ tag }} {{ comp.name }}: {{ detail }}{{ note }}"
      loop: "{{ range(infra_components | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ infra_components[idx].name }}"

    - name: Probe docker containers
      ansible.builtin.shell: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "CONTAINER=nodocker"
        else
          r=$(docker inspect -f '{% raw %}{{.State.Status}}|{{.HostConfig.RestartPolicy.Name}}|{{.State.StartedAt}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}' {{ item.container }} 2>/dev/null)
          if [ -z "$r" ]; then echo "CONTAINER=missing"; else echo "CONTAINER=$r"; fi
        fi
      args:
        executable: /bin/bash
      register: dprobes
      changed_when: false
      failed_when: false
      loop: "{{ docker_components }}"
      loop_control:
        label: "{{ item.container }}"

    - name: Record docker container results
      ansible.builtin.set_fact:
        probe_lines: "{{ probe_lines | default([]) + [line] }}"
        probe_bad: "{{ probe_bad | default([]) + ([comp.name] if (verdict == 'DOWN' and (comp.critical | default(true))) else []) }}"
        boot_warn: "{{ boot_warn | default([]) + ([comp.name ~ ' (docker container ' ~ comp.container ~ ') has restart policy ' ~ (restart or 'no') ~ ', so it will NOT come back after a reboot'] if (dstate not in ['missing', 'nodocker'] and restart in ['', 'no']) else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, comp.tier, comp.name, verdict, detail ~ note]] }}"
      vars:
        comp: "{{ docker_components[idx] }}"
        out: "{{ dprobes.results[idx].stdout | default('CONTAINER=missing') | trim }}"
        dstate: "{{ out | regex_findall('^CONTAINER=([a-z]+)', multiline=True) | first | default('missing') }}"
        restart: "{{ out | regex_findall('^CONTAINER=[a-z]+[|]([a-z-]*)[|]', multiline=True) | first | default('') }}"
        started: "{{ out | regex_findall('^CONTAINER=[a-z]+[|][a-z-]*[|]([^|]*)[|]', multiline=True) | first | default('') }}"
        health: "{{ out | regex_findall('[|]([a-z]+)$', multiline=True) | first | default('none') }}"
        port_up: "{{ ss.stdout is search(':' ~ comp.port ~ ' ') }}"
        verdict: "{{ 'UP' if (dstate == 'running' and health != 'unhealthy' and port_up) else 'DOWN' }}"
        tag: "{{ '[ UP ]' if verdict == 'UP' else '[DOWN]' }}"
        detail: "{{ ('docker container ' ~ comp.container ~ ' is ' ~ dstate ~ ' (restart=' ~ (restart or 'no') ~ ', health=' ~ health ~ ', since ' ~ started[:19] ~ ' UTC); port ' ~ comp.port ~ (' listening' if port_up else ' NOT listening')) if dstate not in ['missing', 'nodocker'] else ('docker container ' ~ comp.container ~ (' not found' if dstate == 'missing' else ' - docker is not installed')) }}"
        note: "{{ '  (non-critical)' if (verdict == 'DOWN' and not (comp.critical | default(true))) else '' }}"
        line: "{{ tag }} {{ comp.name }}: {{ detail }}{{ note }}"
      loop: "{{ range(docker_components | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ docker_components[idx].container }}"

    - name: PostgreSQL reachable from this host
      ansible.builtin.wait_for:
        host: 172.20.250.9
        port: 5432
        timeout: 5
      register: db_reach
      ignore_errors: true

    - name: Messaging, cache and database reachability
      ansible.builtin.debug:
        msg: "{{ probe_lines | default([]) + [db_line] }}"
      vars:
        db_line: "{{ '[ UP ] PostgreSQL 172.20.250.9:5432 is reachable from this host' if not (db_reach.failed | default(false)) else '[DOWN] PostgreSQL 172.20.250.9:5432 is NOT reachable from this host' }}"

    - name: Units and containers that will not come back after a reboot
      ansible.builtin.debug:
        msg: "{{ boot_warn }}"
      when: boot_warn | default([]) | length > 0

    # ---------- 3. does it actually answer? (best effort, informational) ----------
    - name: Redis PING
      ansible.builtin.shell: |
        exec 3<>/dev/tcp/127.0.0.1/6379
        printf 'PING\r\n' >&3
        read -t 2 -r reply <&3
        printf '%s' "$reply"
      args:
        executable: /bin/bash
      register: redis_ping
      changed_when: false
      failed_when: false
      when: ss.stdout is search(':6379 ')

    - name: Schema Registry answers
      ansible.builtin.uri:
        url: http://127.0.0.1:18081/subjects
        timeout: 5
      register: sr
      ignore_errors: true
      when: ss.stdout is search(':18081 ')

    - name: Debezium connector status
      ansible.builtin.uri:
        url: http://127.0.0.1:18083/connectors/license-audit-outbox-connector/status
        timeout: 5
      register: dbz
      ignore_errors: true
      when: ss.stdout is search(':18083 ')

    - name: Deeper checks
      ansible.builtin.debug:
        msg:
          - "Redis PING reply: {{ ping_txt }}   (+PONG is fine; -NOAUTH also means Redis is alive)"
          - "Schema Registry /subjects: {{ sr_txt }}"
          - "Debezium license-audit-outbox-connector: {{ dbz_txt }}"
          - "Eureka: {{ eu_lines | length }} instances registered{{ '' if not_up | length == 0 else '; NOT UP: ' ~ (not_up | join(', ')) }}"
      vars:
        ping_txt: "{{ (redis_ping.stdout | default('') | trim) or 'no reply' }}"
        sr_txt: "{{ 'answers' if (sr.status | default(0)) == 200 else 'no answer' }}"
        dbz_txt: "connector={{ ((dbz.json | default({})).connector | default({})).state | default('unreachable') }} tasks={{ ((dbz.json | default({})).tasks | default([])) | map(attribute='state') | list }}"
        not_up: "{{ eu_lines | reject('search', '[|]UP[|]') | list }}"

    # ---------- 4. every container on the host (sandbox lives here) ----------
    - name: All docker containers
      ansible.builtin.shell: |
        if command -v docker >/dev/null 2>&1; then
          docker ps -a --format '{% raw %}{{.Names}} | {{.Status}} | {{.Ports}}{% endraw %}'
        else
          echo "docker not installed"
        fi
      register: dock
      changed_when: false
      failed_when: false

    - name: Docker report
      ansible.builtin.debug:
        msg: "{{ dock.stdout_lines if dock.stdout_lines | length > 0 else ['no containers'] }}"

    - name: Record backend extras for the report
      ansible.builtin.set_fact:
        host_problems: "{{ (svc_bad | default([])) + (probe_bad | default([])) + (remote_bad | default([])) + (['PostgreSQL unreachable from this host'] if db_bad else []) }}"
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Database', 'PostgreSQL reachable from backend', ('DOWN' if db_bad else 'UP'), '172.20.250.9:5432'], [inventory_hostname, 'Messaging / cache', 'Redis PING', ('UP' if (ping_txt is search('PONG|NOAUTH')) else 'INFO'), ping_txt], [inventory_hostname, 'Messaging / cache', 'Schema Registry /subjects', ('UP' if (sr.status | default(0)) == 200 else 'INFO'), sr_txt], [inventory_hostname, 'Messaging / cache', 'Debezium connector', ('UP' if (dbz_state == 'RUNNING') else 'WARN'), 'license-audit-outbox-connector state=' ~ dbz_state], [inventory_hostname, 'Messaging / cache', 'Eureka registrations', ('OK' if not_up | length == 0 else 'WARN'), (eu_lines | length | string) ~ ' instances registered' ~ ((';  NOT UP: ' ~ (not_up | join(', '))) if not_up | length > 0 else '')], [inventory_hostname, 'Docker', 'All containers', 'INFO', (dock.stdout_lines | join(' ;; ')) or 'no containers']] }}"
      vars:
        db_bad: "{{ db_reach.failed | default(false) }}"
        ping_txt: "{{ (redis_ping.stdout | default('') | trim) or 'no reply' }}"
        sr_txt: "{{ 'answers' if (sr.status | default(0)) == 200 else 'no answer' }}"
        dbz_state: "{{ ((dbz.json | default({})).connector | default({})).state | default('unreachable') }}"
        not_up: "{{ eu_lines | reject('search', '[|]UP[|]') | list }}"

    - name: Uptime
      ansible.builtin.command: uptime -p
      register: up_p
      changed_when: false
      failed_when: false

    - name: Pending reboot flag (the "System restart required" banner)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_req

    - name: Memory
      ansible.builtin.shell: free -m | awk 'NR==2{print $3"/"$2" MB used"}'
      register: mem
      changed_when: false
      failed_when: false

    - name: Filesystems
      ansible.builtin.command: df -P -x tmpfs -x devtmpfs -x squashfs -x overlay
      register: df
      changed_when: false
      failed_when: false

    - name: Host basics
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ up_p.stdout | default('uptime n/a') }} | memory {{ mem.stdout | default('n/a') }}"
          - "{{ reboot_txt }}"
          - "{{ disk_txt }}"

    - name: Record host basics
      ansible.builtin.set_fact:
        report_rows: "{{ report_rows | default([]) + [[inventory_hostname, 'Host', 'Uptime / memory', 'INFO', (up_p.stdout | default('n/a')) ~ ' | memory ' ~ (mem.stdout | default('n/a'))], [inventory_hostname, 'Host', 'Reboot pending', ('WARN' if (reboot_req.stat.exists | default(false)) else 'OK'), reboot_txt], [inventory_hostname, 'Host', 'Disk usage', ('WARN' if hot | length > 0 else 'OK'), disk_txt]] }}"

# ======================= Play 5: build and publish the Excel report =======================
# Runs on the "report host" (default: the cicd_hosts host = the Jenkins server). Skipped if it is not in the inventory.
- name: FinEdge | Health - Excel report
  hosts: "{{ report_host | default(cicd_hosts | default('finedge_cicd')) }}"
  become: true
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  vars:
    report_dir: /var/lib/jenkins/userContent/health-reports
    report_url_base: http://172.20.250.6:8080/userContent/health-reports
    report_owner: jenkins
    report_keep_days: 14
  tasks:
    - name: Mark this host as the report builder
      ansible.builtin.group_by:
        key: finedge_health_reporter
      changed_when: false

    - name: Gather the rows reported by the checked hosts
      ansible.builtin.set_fact:
        all_rows: "{{ all_rows | default([]) + (hostvars[h].report_rows | default([[h, 'Host', 'Reachable', 'DOWN', 'no result from this host (unreachable, or every check failed)']])) }}"
        all_problems: "{{ all_problems | default([]) + ([h ~ ': ' ~ (hostvars[h].host_problems | join(', '))] if (hostvars[h].host_problems | default([]) | length > 0) else ([] if hostvars[h].report_rows is defined else [h ~ ': no result (unreachable?)'])) }}"
      loop: "{{ groups['finedge_health_checked'] | default([]) }}"
      loop_control:
        loop_var: h
        label: "{{ h }}"

    - name: Work out the summary
      ansible.builtin.set_fact:
        payload:
          sheets:
            - name: Summary
              header: [Item, Value]
              widths: [26, 120]
              rows:
                - ['Overall', "{{ 'HEALTHY' if all_problems | default([]) | length == 0 else 'PROBLEMS' }}"]
                - ['Critical problems', "{{ all_problems | default([]) | join('  ||  ') or 'none' }}"]
                - ['Hosts reported', "{{ all_rows | default([]) | map('first') | unique | join(', ') }}"]
                - ['UP / OK', "{{ (all_rows | default([]) | selectattr('3', 'in', ['UP', 'OK']) | list | length) }}"]
                - ['DOWN / MISSING', "{{ (all_rows | default([]) | selectattr('3', 'in', ['DOWN', 'MISSING']) | list | length) }}"]
                - ['WAIT / WARN', "{{ (all_rows | default([]) | selectattr('3', 'in', ['WAIT', 'WARN']) | list | length) }}"]
                - ['Reports folder', "{{ report_url_base }}/"]
            - name: Details
              header: [Host, Tier, Component, Status, Detail]
              widths: [20, 22, 38, 11, 130]
              rows: "{{ all_rows | default([]) }}"

    - name: Report folder
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: "{{ report_owner }}"
        mode: "0755"
      run_once: true

    - name: Upload the data
      ansible.builtin.copy:
        content: "{{ payload | to_json }}"
        dest: /tmp/finedge_rows.json
        mode: "0600"
      run_once: true

    - name: Upload the XLSX writer (standard library only, no extra packages)
      ansible.builtin.copy:
        dest: /tmp/finedge_make_report.py
        mode: "0700"
        content: |
          {% raw %}
          import sys, json, zipfile, os, re, time, datetime
          from xml.sax.saxutils import escape

          def col(n):
              s = ''
              n += 1
              while n:
                  n, r = divmod(n - 1, 26)
                  s = chr(65 + r) + s
              return s

          def clean(v):
              return re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f]', '', str(v))

          def status_style(v):
              u = str(v).strip().upper()
              if u in ('UP', 'OK', 'HEALTHY'):
                  return 2
              if u in ('DOWN', 'MISSING', 'FAILED', 'PROBLEMS'):
                  return 3
              if u in ('WAIT', 'WARN', 'ABSENT', 'INFO'):
                  return 4
              return 0

          def sheet_xml(header, rows, widths):
              allrows = [header] + rows
              out = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
                     '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
                     '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>',
                     '<cols>' + ''.join('<col min="%d" max="%d" width="%s" customWidth="1"/>' % (i + 1, i + 1, w) for i, w in enumerate(widths)) + '</cols>',
                     '<sheetData>']
              for r, row in enumerate(allrows, start=1):
                  cells = []
                  for c in range(len(header)):
                      val = row[c] if c < len(row) else ''
                      if r == 1:
                          st = 1
                      elif header[c] == 'Status':
                          st = status_style(val)
                      else:
                          st = 0
                      cells.append('<c r="%s%d" t="inlineStr" s="%d"><is><t xml:space="preserve">%s</t></is></c>' % (col(c), r, st, escape(clean(val))))
                  out.append('<row r="%d">%s</row>' % (r, ''.join(cells)))
              out.append('</sheetData>')
              out.append('<autoFilter ref="A1:%s%d"/>' % (col(len(header) - 1), len(allrows)))
              out.append('</worksheet>')
              return ''.join(out)

          STYLES = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
           '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
           '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
           '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'
           '<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
           '<fill><patternFill patternType="solid"><fgColor rgb="FF1F3864"/><bgColor indexed="64"/></patternFill></fill>'
           '<fill><patternFill patternType="solid"><fgColor rgb="FFC6EFCE"/><bgColor indexed="64"/></patternFill></fill>'
           '<fill><patternFill patternType="solid"><fgColor rgb="FFFFC7CE"/><bgColor indexed="64"/></patternFill></fill>'
           '<fill><patternFill patternType="solid"><fgColor rgb="FFFFEB9C"/><bgColor indexed="64"/></patternFill></fill></fills>'
           '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
           '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
           '<cellXfs count="5">'
           '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
           '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'
           '<xf numFmtId="0" fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1"/>'
           '<xf numFmtId="0" fontId="0" fillId="4" borderId="0" xfId="0" applyFill="1"/>'
           '<xf numFmtId="0" fontId="0" fillId="5" borderId="0" xfId="0" applyFill="1"/>'
           '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')

          def write_xlsx(path, sheets):
              n = len(sheets)
              ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
                    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
                    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
                    '<Default Extension="xml" ContentType="application/xml"/>',
                    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
                    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>']
              for i in range(n):
                  ct.append('<Override PartName="/xl/worksheets/sheet%d.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' % (i + 1))
              ct.append('</Types>')
              rels = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
                      '</Relationships>')
              wb = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
                    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>']
              wbrels = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
                        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">']
              for i, s in enumerate(sheets):
                  nm = re.sub(r'[\[\]\*\?:/\\]', '', s['name'])[:31]
                  wb.append('<sheet name="%s" sheetId="%d" r:id="rId%d"/>' % (escape(nm), i + 1, i + 1))
                  wbrels.append('<Relationship Id="rId%d" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet%d.xml"/>' % (i + 1, i + 1))
              wb.append('</sheets></workbook>')
              wbrels.append('<Relationship Id="rId%d" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' % (n + 1))
              wbrels.append('</Relationships>')
              tmp = path + '.tmp'
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.writestr('[Content_Types].xml', ''.join(ct))
                  z.writestr('_rels/.rels', rels)
                  z.writestr('xl/workbook.xml', ''.join(wb))
                  z.writestr('xl/_rels/workbook.xml.rels', ''.join(wbrels))
                  z.writestr('xl/styles.xml', STYLES)
                  for i, s in enumerate(sheets):
                      z.writestr('xl/worksheets/sheet%d.xml' % (i + 1), sheet_xml(s['header'], s['rows'], s['widths']))
              os.replace(tmp, path)

          def main():
              rows_json, outdir, keep_days = sys.argv[1], sys.argv[2], int(sys.argv[3])
              data = json.load(open(rows_json))
              wat = datetime.timezone(datetime.timedelta(hours=1))   # Lagos (WAT, UTC+1, no daylight saving). The servers themselves run on New York time.
              now = datetime.datetime.now(wat)
              data['sheets'][0]['rows'].insert(0, ['Generated (Lagos time, WAT)', now.strftime('%Y-%m-%d %H:%M:%S')])
              os.makedirs(outdir, exist_ok=True)
              stamped = os.path.join(outdir, 'finedge-health-%s.xlsx' % now.strftime('%Y%m%d-%H%M%S'))
              latest = os.path.join(outdir, 'finedge-health-latest.xlsx')
              write_xlsx(stamped, data['sheets'])
              write_xlsx(latest, data['sheets'])
              cutoff = time.time() - keep_days * 86400
              for f in os.listdir(outdir):
                  if re.match(r'finedge-health-\d{8}-\d{6}\.xlsx$', f):
                      p = os.path.join(outdir, f)
                      if os.path.getmtime(p) < cutoff:
                          os.remove(p)
              print(json.dumps({'latest': os.path.basename(latest), 'stamped': os.path.basename(stamped)}))

          main()
          {% endraw %}
      run_once: true

    - name: Build the XLSX
      ansible.builtin.command: "python3 /tmp/finedge_make_report.py /tmp/finedge_rows.json {{ report_dir }} {{ report_keep_days }}"
      register: rep
      changed_when: true
      run_once: true

    - name: Let the report owner read the files
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: "{{ report_owner }}"
        recurse: true
      run_once: true

    - name: Remove temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/tmp/finedge_rows.json, /tmp/finedge_make_report.py]
      run_once: true

    - name: Remember where the report is
      ansible.builtin.set_fact:
        report_url: "{{ report_url_base }}/{{ (rep.stdout | from_json).latest }}"
        report_url_stamped: "{{ report_url_base }}/{{ (rep.stdout | from_json).stamped }}"
        report_folder_url: "{{ report_url_base }}/"
        report_server_path: "{{ report_dir }}"
      run_once: true
      when: (rep.rc | default(1)) == 0

    - name: Attach the link to the AWX job
      ansible.builtin.set_stats:
        data:
          health_report_url: "{{ report_url }}"
          health_report_folder: "{{ report_folder_url }}"
      run_once: true
      when: (rep.rc | default(1)) == 0

# ======================= Play 6: final result =======================
- name: FinEdge | Health - FINAL RESULT
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    fail_on_problems: false
  tasks:
    - name: Gather results from the checked hosts
      ansible.builtin.set_fact:
        all_rows: "{{ all_rows | default([]) + (hostvars[h].report_rows | default([[h, 'Host', 'Reachable', 'DOWN', 'no result from this host (unreachable, or every check failed)']])) }}"
        all_problems: "{{ all_problems | default([]) + ([h ~ ': ' ~ (hostvars[h].host_problems | join(', '))] if (hostvars[h].host_problems | default([]) | length > 0) else ([] if hostvars[h].report_rows is defined else [h ~ ': no result (unreachable?)'])) }}"
      loop: "{{ groups['finedge_health_checked'] | default([]) }}"
      loop_control:
        loop_var: h
        label: "{{ h }}"

    - name: Find the report link
      ansible.builtin.set_fact:
        report_urls: "{{ report_urls | default([]) + ([hostvars[r].report_url] if (hostvars[r].report_url is defined) else []) }}"
        report_folders: "{{ report_folders | default([]) + ([hostvars[r].report_folder_url] if (hostvars[r].report_folder_url is defined) else []) }}"
        report_paths: "{{ report_paths | default([]) + ([hostvars[r].report_server_path] if (hostvars[r].report_server_path is defined) else []) }}"
      loop: "{{ groups['finedge_health_reporter'] | default([]) }}"
      loop_control:
        loop_var: r
        label: "{{ r }}"

    - name: FINAL RESULT
      ansible.builtin.debug:
        msg: "{{ lines }}"
      vars:
        has_report: "{{ report_urls | default([]) | length > 0 }}"
        lines:
          - "=============================================================="
          - "OVERALL: {{ 'ALL CHECKED SERVICES HEALTHY' if all_problems | default([]) | length == 0 else 'CRITICAL PROBLEMS' }}"
          - "{{ all_problems | default([]) | join('   ||   ') if all_problems | default([]) | length > 0 else 'no critical problems' }}"
          - "HOSTS CHECKED: {{ groups['finedge_health_checked'] | default([]) | join(', ') or 'none' }}"
          - "{{ ('EXCEL REPORT:  ' ~ (report_urls | first)) if has_report else 'EXCEL REPORT:  not published (no report host in the inventory, or it was unreachable) - full table below' }}"
          - "{{ ('ALL REPORTS:   ' ~ (report_folders | first)) if has_report else '' }}"
          - "{{ ('ON THE SERVER: ' ~ (report_paths | first)) if has_report else '' }}"
          - "(log in to Jenkins in the same browser first. Times in the workbook are Lagos time.)"
          - "=============================================================="

    - name: Full table (shown only when no Excel report was published)
      ansible.builtin.debug:
        msg: "{{ ['Host | Tier | Component | Status | Detail'] + (all_rows | default([]) | map('join', ' | ') | list) }}"
      when: report_urls | default([]) | length == 0

    - name: Fail the job if asked to (extra var fail_on_problems=true)
      ansible.builtin.fail:
        msg: "UNHEALTHY -> {{ all_problems }}"
      when: (fail_on_problems | bool) and (all_problems | default([]) | length > 0)
