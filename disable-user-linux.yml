---
- name: Audit, Disable, and Verify Target Users on Linux
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    target_users:
      - olanrenwaju
      - ferdinand

  tasks:
    - name: Test connectivity to host
      ansible.builtin.ping:
        register: ping_result
        ignore_unreachable: true
        ignore_errors: true

    - name: Check if target users exist on the server
      when: ping_result is succeeded
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: "{{ target_users }}"
      register: user_check
      failed_when: false
      ignore_errors: true

    - name: Disable target user only if they actually exist
      when: 
        - ping_result is succeeded
        - user_check.results[ansible.loop.index0].failed is not defined or not user_check.results[ansible.loop.index0].failed
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop: "{{ target_users }}"
      register: disable_results
      ignore_errors: true

    - name: Run system status check (passwd -S) on disabled users
      when: 
        - ping_result is succeeded
        - disable_results.results is defined
      ansible.builtin.shell: "passwd -S {{ item.item }}"
      loop: "{{ disable_results.results }}"
      when: 
        - ping_result is succeeded
        - item.skipped is not defined or not item.skipped
        - item.failed is not defined or not item.failed
      register: status_results
      changed_when: false
      ignore_errors: true

    - name: Display report ONLY for servers where users were found and disabled
      when: 
        - ping_result is succeeded
        - status_results.results is defined
        - status_results.results | length > 0
      ansible.builtin.debug:
        msg: |
          ======================================================================
          SUCCESS: TARGET USERS DISABLED & VERIFIED ON {{ inventory_hostname }}
          ======================================================================
          {% for res in status_results.results %}
            - {{ res.stdout }}
          {% endfor %}
          ----------------------------------------------------------------------
      ignore_errors: true
