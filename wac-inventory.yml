---
- name: Enterprise WAC Inventory Synchronization
  hosts: all
  gather_facts: false
  vars:
    # Change this to your exact WAC gateway hostname as it appears in your AWX inventory
    wac_gateway_host: "wac-gateway.yourdomain.local" 

    connection_type: "msft.sme.connection-type.server"
    connection_group: "global"
    connection_tags: "AWX-AutoDiscovered"

  tasks:
    - name: Fetch current connections registered in Windows Admin Center
      ansible.windows.win_shell: |
        Get-WacConnection -ErrorAction SilentlyContinue | Select-Object -ExpandProperty name
      register: wac_raw_connections
      changed_when: false
      delegate_to: "{{ wac_gateway_host }}"
      run_once: true

    - name: Process and normalize registered server list from WAC
      set_fact:
        registered_servers: "{{ wac_raw_connections.stdout_lines | map('trim') | map('lower') | list }}"
      run_once: true

    - name: Extract all target servers dynamically from AWX inventory context
      set_fact:
        # ansible_play_hosts automatically contains all hosts in your inventory when using hosts: all
        # We exclude the gateway itself so it doesn't try to add itself as a managed node
        expected_servers: "{{ ansible_play_hosts | reject('match', '.*' + wac_gateway_host + '.*') | map('lower') | list }}"
      run_once: true

    - name: Compute the difference (Servers missing from WAC)
      set_fact:
        servers_to_add: "{{ expected_servers | difference(registered_servers) }}"
      run_once: true

    - name: End playbook execution early if all servers are already synced
      meta: end_play
      when: servers_to_add | length == 0
      run_once: true

    - name: Generate bulk CSV batch file on WAC Gateway for the missing servers
      ansible.windows.win_copy:
        content: |
          name,type,tags,groupId
          {% for server in servers_to_add %}
          {{ server }},{{ connection_type }},{{ connection_tags }},{{ connection_group }}
          {% endfor %}
        dest: "C:\\Temp\\wac_bulk_sync.csv"
      register: csv_creation
      delegate_to: "{{ wac_gateway_host }}"
      run_once: true

    - name: Import the missing servers into Windows Admin Center in bulk
      ansible.windows.win_shell: |
        Import-WACConnection -FileName "C:\\Temp\\wac_bulk_sync.csv" -ErrorAction Stop
      register: bulk_import_result
      delegate_to: "{{ wac_gateway_host }}"
      run_once: true

    - name: Clean up temporary batch file from gateway
      ansible.windows.win_file:
        path: "C:\\Temp\\wac_bulk_sync.csv"
        state: absent
      when: csv_creation is succeeded
      delegate_to: "{{ wac_gateway_host }}"
      run_once: true

    - name: Log synchronization summary results
      debug:
        msg:
          - "Total servers evaluated from AWX inventory: {{ expected_servers | length }}"
          - "Servers already present in WAC: {{ expected_servers | length - servers_to_add | length }}"
          - "New servers successfully added to WAC: {{ servers_to_add }}"
      run_once: true
